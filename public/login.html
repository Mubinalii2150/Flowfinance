<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FlowFinance Login</title>

<link rel="stylesheet" href="login.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

<div class="left">

<h1>FlowFinance</h1>

<h2>Welcome Back 👋</h2>

<p>
Login to continue managing your business finances.
</p>

</div>

<div class="right">

<form id="loginForm">

<h2>Login</h2>

<input type="email"
id="email"
placeholder="Email"
required>

<input type="password"
id="password"
placeholder="Password"
required>

<button type="submit">

Login

</button>

<p>

Don't have an account?

<a href="register.html">

Register

</a>

</p>

</form>

</div>

</div>

<script src="login.js"></script>

</body>

</html>
